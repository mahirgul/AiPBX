name: iOS Build & Package

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ./ios
        run: |
          xcodegen generate

      - name: Build for iOS Simulator (Universal Release)
        working-directory: ./ios
        run: |
          xcodebuild clean build \
            -project AiPBX.xcodeproj \
            -scheme AiPBX \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build iOS Archive (Device Release)
        working-directory: ./ios
        run: |
          xcodebuild archive \
            -project AiPBX.xcodeproj \
            -scheme AiPBX \
            -destination "generic/platform=iOS" \
            -archivePath build/AiPBX.xcarchive \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload and IPA
        working-directory: ./ios
        run: |
          mkdir -p build/Payload
          cp -r build/AiPBX.xcarchive/Products/Applications/AiPBX.app build/Payload/
          cd build && zip -r AiPBX-unsigned.ipa Payload
          cd DerivedData/Build/Products/Release-iphonesimulator && zip -r ../../../../build/AiPBX-Simulator.zip AiPBX.app

      - name: Upload iOS App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AiPBX-iOS-Build
          path: |
            ios/build/AiPBX-unsigned.ipa
            ios/build/AiPBX-Simulator.zip
          retention-days: 14
