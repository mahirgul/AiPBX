name: Thank new issues

# A short thank-you on every new issue, with a word about sponsoring the project.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  thank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Thank you for taking the time to open this issue! We read every report and will get back to you as soon as we can.',
                '',
                '💙 AiPBX is built and maintained with a lot of time and care. In our pursuit of getting every detail right, your support makes a real difference: if AiPBX is useful to you or your company, please consider [sponsoring the project](https://github.com/sponsors/mahirgul). Even $1, $3 or $5 a month helps — every drop counts.',
              ].join('\n'),
            });
