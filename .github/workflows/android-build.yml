name: Android Build & Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-*.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the APK to this existing GitHub Release (e.g. v1.0.0); skips Google Play'
        required: false
        default: ''
        type: string
      track:
        description: 'Google Play Track (alpha = Closed Testing, internal = Internal Testing, beta = Open Testing, production = Production)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - alpha
          - internal
          - beta
      android_build:
        description: 'Android-only rebuild of the same release: 1..99 (versionCode = release code + this). 0 = the release build'
        required: false
        default: '0'
        type: string
      upload_to_play:
        description: 'Upload AAB to Google Play Console'
        required: true
        type: boolean
        default: true
      release_status:
        description: 'Release Status (completed = Publish immediately, draft = Save as Draft for review)'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted

jobs:
  build:
    name: Build Android App & Deploy
    # App releases only: model files are published as releases too (models-* tags).
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # gh release upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A manual run with release_tag builds that release's code, not the
          # branch it was started from (otherwise another version's app would be
          # attached to the release).
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0   # tags, to compare with the previous release

      # A server-only release does not rebuild or upload the app: Google Play
      # would get an identical app under a new version. The previous release's
      # APK is carried over instead, so releases/latest/download/aipbx-latest.apk
      # (the website's download link) keeps working.
      - name: Android changes since the previous release
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" != "release" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT; exit 0
          fi
          prev="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -1)"
          echo "previous=$prev" >> $GITHUB_OUTPUT
          if [ -z "$prev" ] || ! git diff --quiet "$prev" "$TAG" -- android ':!android/play-release-notes.json'; then
            echo "Android changed since ${prev:-the beginning} -> build and upload."
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No Android change since $prev -> no build, no Google Play upload; the APK is carried over."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Carry the previous release's APK over
        if: ${{ steps.changes.outputs.changed == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PREV: ${{ steps.changes.outputs.previous }}
        run: |
          gh release download "$PREV" -p aipbx-latest.apk --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" aipbx-latest.apk --clobber --repo "$GITHUB_REPOSITORY"

      - name: Set up JDK 17
        if: ${{ steps.changes.outputs.changed == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        if: ${{ steps.changes.outputs.changed == 'true' }}
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Configure Keystore & Signing
        if: ${{ steps.changes.outputs.changed == 'true' }}
        id: prep_signing
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release-key.jks
            echo "storeFile=release-key.jks" > keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "Release keystore configured successfully."
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Add it under the repository Settings -> Secrets and variables -> Actions."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Grant execute permission for gradlew
        if: ${{ steps.changes.outputs.changed == 'true' }}
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Android Release Bundle (AAB) & APK
        if: ${{ steps.changes.outputs.changed == 'true' }}
        working-directory: ./android
        env:
          ANDROID_BUILD: ${{ inputs.android_build || '0' }}
        run: |
          ./gradlew testDebugUnitTest bundleRelease assembleRelease -PandroidBuild="$ANDROID_BUILD" --stacktrace

      # Google Play warns about edge-to-edge ("deprecated APIs or parameters"):
      # the source rules and the BUILT app (libraries included) must be clean,
      # or the release does not leave CI. See app/src/main/java/.../ui/BaseActivity.kt.
      - name: Edge-to-edge checks (source + built app)
        if: ${{ steps.changes.outputs.changed == 'true' }}
        working-directory: ./android
        run: |
          bash bin/edge_to_edge_audit.sh
          bash bin/check_deprecated_window_apis.sh app/build/outputs/apk/release/app-release.apk app/build/outputs/mapping/release/mapping.txt

      - name: Upload Android Build Artifacts
        if: ${{ steps.changes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: AiPBX-Android-Release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: ${{ steps.changes.outputs.changed == 'true' && (github.event_name == 'release' || inputs.release_tag != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          # Fixed asset name: https://github.com/<repo>/releases/latest/download/aipbx-latest.apk
          cp android/app/build/outputs/apk/release/app-release.apk aipbx-latest.apk
          gh release upload "$RELEASE_TAG" aipbx-latest.apk --clobber --repo "$GITHUB_REPOSITORY"

      - name: Check Google Play Upload Eligibility
        id: check_upload
        if: ${{ steps.changes.outputs.changed == 'true' && (github.event_name != 'pull_request') }}
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_STORE_JSON_KEY }}
          EVENT: ${{ github.event_name }}
          INPUT_UPLOAD: ${{ inputs.upload_to_play }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          # The app's versionCode comes from VERSION, so it changes only with a
          # release: Google Play gets the build of a published release (and a
          # manual run). A push to main only builds and tests — a second push
          # would have the same versionCode, which Play rejects.
          if [ "$EVENT" = "push" ]; then
            echo "Push to main -> build and tests only; Google Play gets published releases."
            echo "can_upload=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -n "$DISPATCH_TAG" ]; then
            echo "Attaching the APK to $DISPATCH_TAG -> Google Play upload skipped."
            echo "can_upload=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "GitHub Event: ${{ github.event_name }}"
          if [ -n "$PLAY_KEY_JSON" ]; then
            echo "Google Play Service Account Secret: MEVCUT"
          else
            echo "Google Play Service Account Secret: BULUNAMADI"
          fi

          if [ -z "$PLAY_KEY_JSON" ]; then
            echo "::warning::PLAY_STORE_JSON_KEY secret is missing; skipping the Google Play Console upload."
            echo "can_upload=false" >> $GITHUB_OUTPUT
          elif [ "$EVENT" = "release" ] || [ "$INPUT_UPLOAD" = "true" ]; then
            echo "Google Play upload requirements met -> uploading."
            echo "can_upload=true" >> $GITHUB_OUTPUT
          else
            echo "upload_to_play=false: skipping the upload."
            echo "can_upload=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python for Play Console Upload
        if: ${{ steps.changes.outputs.changed == 'true' && (steps.check_upload.outputs.can_upload == 'true') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API Client
        if: ${{ steps.changes.outputs.changed == 'true' && (steps.check_upload.outputs.can_upload == 'true') }}
        run: |
          pip install --upgrade google-api-python-client google-auth

      - name: Deploy AAB to Google Play Console
        if: ${{ steps.changes.outputs.changed == 'true' && (steps.check_upload.outputs.can_upload == 'true') }}
        working-directory: ./android
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          echo "$PLAY_KEY_JSON" > play-service-account.json
          export PLAY_STORE_JSON_KEY_FILE="play-service-account.json"
          
          TRACK="${{ inputs.track || 'production' }}"
          STATUS="${{ inputs.release_status || 'completed' }}"
          
          echo "=========================================="
          echo "Uploading AAB to Google Play Console..."
          echo "Track: $TRACK"
          echo "Desired Status: $STATUS"
          echo "=========================================="
          
          python3 upload_to_play_console.py "$TRACK" "$STATUS"
          
          # Clean up service account file
          rm -f play-service-account.json
