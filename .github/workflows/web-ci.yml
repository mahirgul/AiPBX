name: Web & Chat CI

# Checks that run on every push for the web portal (PHP), the chat service (Go)
# and the local AI service (Python).
# Until 2026-09-27 only Android/iOS were built; that is why bugs breaking the
# conference/ring group saves and the push settings went unnoticed.

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'chat/**'
      - 'ai/**'
      - 'scripts/i18n.py'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'chat/**'
      - 'ai/**'
      - 'scripts/i18n.py'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: PHP — lint, PHPStan, unit tests, smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: asterisk_test
          MARIADB_USER: aipbx_test
          MARIADB_PASSWORD: ci-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      # Tests run only against asterisk_test (the tests/bootstrap.php lock).
      DB_HOST: 127.0.0.1
      DB_NAME: asterisk_test
      DB_USER: aipbx_test
      DB_PASS: ci-test
      # No step sends a command to a real Asterisk.
      AIPBX_NO_ASTERISK: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'   # what the servers run (Ubuntu 26.04)
          extensions: pdo_mysql, mbstring, intl, gd, curl, dom, xml, zip
          coverage: none
          # mail() needs a sendmail; the tests check what is sent, not delivery.
          ini-values: sendmail_path=/usr/bin/true
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Language files (tr/en keys)
        run: php bin/lint_lang.php

      - name: Translations (keys, placeholders, HTML tags against English)
        run: python3 ../scripts/i18n.py check

      - name: PHPStan
        run: php -d memory_limit=2G vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Test database schema (Phinx) and roles
        run: |
          printf 'DB_HOST=%s\nDB_NAME=%s\nDB_USER=%s\nDB_PASS=%s\n' "$DB_HOST" "$DB_NAME" "$DB_USER" "$DB_PASS" > tests/.env.test
          php vendor/bin/phinx migrate -e testing
          mysql -h "$DB_HOST" -u root -pci-root "$DB_NAME" -e "INSERT IGNORE INTO sys_roles (role_key, role_name, description, is_system) VALUES
            ('admin', 'Yönetici', 'Tam yetkili', 1),
            ('read_only_admin', 'İzleyici', 'İzleyici', 1),
            ('cc_agent', 'Temsilci', 'Temsilci', 1),
            ('fax_user', 'Faks', 'Faks', 1),
            ('cc_manager', 'Kuyruk Yönetici', 'Kuyruk Yönetici', 1),
            ('user', 'Kullanıcı', 'Kullanıcı', 1);"
          # bin/smoke.php renders pages with a user_id=1 session (the first admin
          # on servers); it has an extension for the pages that need one (My Phone, chat).
          mysql -h "$DB_HOST" -u root -pci-root "$DB_NAME" -e "INSERT IGNORE INTO sys_users
            (id, username, password_hash, full_name, email, role, extension, extension_type, sip_password, is_active)
            VALUES (1, 'admin', '', 'CI Admin', 'admin@example.com', 'admin', '1000', 'sip', 'ci-not-a-secret', 1);"

      - name: Unit tests
        # mail() must not send real email (no MTA in CI); the invitation tests only
        # expect the sending to count as successful.
        run: php -d "sendmail_path=cat > /dev/null" vendor/bin/phpunit --no-coverage

      - name: Smoke (every route in tr/en, RBAC, conventions, lint)
        run: |
          export ASTERISK_PBX_DIR="$RUNNER_TEMP/aipbx-pbx"
          mkdir -p "$ASTERISK_PBX_DIR"
          php bin/smoke.php

  chat:
    name: Go — gofmt, vet, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: chat/go.mod
          cache-dependency-path: chat/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: Static build (CGO off — also runs on older glibc, e.g. Rocky 8)
        run: CGO_ENABLED=0 go build -o /dev/null .

  ai:
    name: Python — local AI service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Fake model backend: no torch or model download needed.
      - name: Unit tests
        run: python -m unittest discover -v ai/tests
