name: Install test

# A fresh install with install.sh on a clean Ubuntu 26.04, then `aipbx-selftest`
# (docs/health.md). Catches what only shows on a new server: a package, a
# folder owner, a firewall rule or a unit the installer forgot. Until
# 2026-10-14 such bugs were found only by installing by hand.
#
# Output is streamed and kept (see "Logs on failure or cancellation" and the
# artifact below). Before 2026-10-26 the installer's output went through
# `tail -60`, which prints nothing until the pipe closes, and the only log step
# was `if: failure()`. A run that stalled inside install.sh therefore showed an
# empty step for 45 minutes and then lost its log to the job timeout, with no
# way to tell a hung apt from a slow download.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'conf/**'
      - 'web/bin/**'
      - 'web/db/**'
      - 'web/src/sync/**'
      - 'web/src/services/health/**'
      - 'web/src/services/HealthService.php'
      - '.github/workflows/install-test.yml'
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: install-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Fresh install + self test
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Make room for MariaDB
        # The runner image ships MySQL; the installer brings MariaDB.
        run: |
          sudo systemctl stop mysql 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y -qq 'mysql-*' >/dev/null 2>&1 || true
          sudo rm -rf /var/lib/mysql /etc/mysql

      - name: install.sh
        run: |
          sudo mkdir -p /opt/aipbx
          sudo cp -a . /opt/aipbx/
          cd /opt/aipbx
          # Streamed line by line, so the live log says where the installer is
          # and where it stopped. `tee` keeps the full log for the artifact,
          # and `sed -u` stops sed from adding a buffer of its own on top of
          # the pipe's. No `tail`: that was what hid a 45-minute stall.
          sudo DEBIAN_FRONTEND=noninteractive bash install.sh </dev/null 2>&1 \
            | tee /tmp/install.log \
            | sed -u 's/\x1b\[[0-9;]*m//g'
          test "${PIPESTATUS[0]}" -eq 0

      - name: aipbx-selftest
        run: sudo /usr/local/sbin/aipbx-selftest

      # The only test that makes a WebRTC call. Everything else passed while v1.60.4 dropped every
      # meeting guest after 30 seconds. Needs a browser and Node 22, which the runner may not have.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: A real video meeting between two browsers
        timeout-minutes: 6
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path /tmp/chrome > /tmp/chrome.txt
            CHROME="$(awk '{print $2}' /tmp/chrome.txt | tail -1)"
          fi
          TOKEN="$(sudo php scripts/e2e/meeting_setup.php create | tail -1)"
          CHROME_BIN="$CHROME" node scripts/e2e/meeting_call.mjs https://127.0.0.1 "$TOKEN"
          sudo php scripts/e2e/meeting_setup.php clean

      - name: Logs on failure or cancellation
        # `cancelled()` as well as `failure()`: the job timeout cancels rather
        # than fails, which is exactly the case that used to end with no log at
        # all. Steps with `always()`/`cancelled()` run during cancellation, so
        # this is where the last of the streamed output is turned into a file
        # the upload step can see.
        if: cancelled() || failure()
        run: |
          cp /tmp/install.log install.log 2>/dev/null || true
          echo "::group::the installer log (last 200 lines; the full file is the install-log artifact)"
          tail -200 /tmp/install.log 2>/dev/null || echo "(no /tmp/install.log — the installer did not start)"
          echo "::endgroup::"
          sudo journalctl --no-pager -n 100 -u asterisk -u apache2 -u nginx -u aipbx-chat -u mariadb || true

      - name: Upload the install log
        if: cancelled() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log
          # /tmp is outside the workspace, so the step above copies it in; the
          # uploader only sees workspace paths.
          path: install.log
          if-no-files-found: ignore
          retention-days: 14
