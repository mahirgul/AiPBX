<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiPBX — 404 Sayfa Bulunamadı</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 48px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            max-width: 500px;
            width: 100%;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: #0284c7;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin: 0 0 12px; }
        p { color: #64748b; font-size: 0.98rem; line-height: 1.6; margin: 0 0 24px; }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #0284c7;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-home:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1>Sayfa Bulunamadı</h1>
        <p>Aradığınız sayfa kaldırılmış veya bağlantı adresi değişmiş olabilir.</p>
        <a href="index.html" class="btn-home">
            <i class="fa-solid fa-house"></i>
            <span>Ana Sayfaya Dön</span>
        </a>
    </div>
</body>
</html>
