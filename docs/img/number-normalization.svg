<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="100%" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" role="img" aria-label="The order in which AiPBX changes numbers on outgoing and incoming calls"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#475569"/></marker></defs><rect width="1180" height="720" fill="#ffffff"/><rect x="10" y="10" width="1160" height="215" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="24" y="34" font-size="15" font-weight="800" fill="#0369a1">Outgoing call: the number being dialled</text><rect x="24" y="45" width="200" height="120" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><circle cx="40" cy="63" r="11" fill="#0284c7"/><text x="40" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="56" y="67" font-size="13" font-weight="700" fill="#0f172a">Device rules</text><text x="34" y="87" font-size="11.5" fill="#334155">Outbound Call Normalization</text><text x="34" y="103" font-size="11.5" fill="#334155">One set per device type:</text><text x="34" y="119" font-size="11.5" fill="#334155">desk, mobile, web</text><text x="34" y="135" font-size="11.5" fill="#334155">Most specific pattern wins</text><text x="34" y="151" font-size="11.5" fill="#334155">One rule, once: then to the route</text><rect x="250" y="45" width="225" height="120" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><circle cx="266" cy="63" r="11" fill="#0284c7"/><text x="266" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="282" y="67" font-size="13" font-weight="700" fill="#0f172a">Outbound route</text><text x="260" y="87" font-size="11.5" fill="#334155">Outbound Routes page</text><text x="260" y="103" font-size="11.5" fill="#334155">The pattern picks the route</text><text x="260" y="119" font-size="11.5" fill="#334155">Then, for that route:</text><text x="260" y="135" font-size="11.5" fill="#334155">Strip Front, Strip Back,</text><text x="260" y="151" font-size="11.5" fill="#334155">Prepend, Append</text><rect x="500" y="45" width="225" height="120" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><circle cx="516" cy="63" r="11" fill="#0284c7"/><text x="516" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="532" y="67" font-size="13" font-weight="700" fill="#0f172a">Trunk prefix</text><text x="510" y="87" font-size="11.5" fill="#334155">Trunks: Carrier Dialled Number</text><text x="510" y="103" font-size="11.5" fill="#334155">Strip Prefix, Prepend Prefix</text><text x="510" y="119" font-size="11.5" fill="#334155">Once per trunk tried, so a</text><text x="510" y="135" font-size="11.5" fill="#334155">fallback trunk starts again</text><text x="510" y="151" font-size="11.5" fill="#334155">from the result of step 2</text><rect x="750" y="45" width="195" height="120" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><circle cx="766" cy="63" r="11" fill="#0284c7"/><text x="766" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="782" y="67" font-size="13" font-weight="700" fill="#0f172a">Trunk E.164</text><text x="760" y="87" font-size="11.5" fill="#334155">Trunks: Send as E.164</text><text x="760" y="103" font-size="11.5" fill="#334155">Country dialling plan</text><text x="760" y="119" font-size="11.5" fill="#334155">Under 7 digits: unchanged</text><text x="760" y="135" font-size="11.5" fill="#334155">Already +: unchanged</text><rect x="970" y="45" width="190" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="980" y="67" font-size="13" font-weight="700" fill="#0f172a">Carrier</text><text x="980" y="87" font-size="11.5" fill="#334155">The number in the</text><text x="980" y="103" font-size="11.5" fill="#334155">SIP INVITE</text><line x1="224" y1="105" x2="244" y2="105" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="475" y1="105" x2="494" y2="105" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="725" y1="105" x2="744" y2="105" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="945" y1="105" x2="964" y2="105" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="32" y="190" font-size="12" font-family="monospace" font-weight="700" fill="#0f766e">+4366412345678</text><text x="258" y="190" font-size="12" font-family="monospace" font-weight="700" fill="#0f766e">066412345678</text><text x="508" y="190" font-size="12" font-family="monospace" font-weight="700" fill="#0f766e">066412345678</text><text x="758" y="190" font-size="12" font-family="monospace" font-weight="700" fill="#0f766e">+4366412345678</text><text x="978" y="190" font-size="12" font-family="monospace" font-weight="700" fill="#0f766e">+4366412345678</text><text x="24" y="213" font-size="11" fill="#64748b">Example, tested with a real call: mobile rule _+43. removes 3 and prepends 0; route and trunk prefixes empty; trunk E.164 set to Austria.</text><rect x="10" y="235" width="1160" height="195" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="24" y="259" font-size="15" font-weight="800" fill="#7c3aed">Outgoing call: the caller ID that is sent</text><rect x="24" y="270" width="350" height="95" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="40" cy="288" r="11" fill="#7c3aed"/><text x="40" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="56" y="292" font-size="13" font-weight="700" fill="#0f172a">One number is chosen</text><text x="34" y="312" font-size="11.5" fill="#334155">First that is set: the route's Caller ID override,</text><text x="34" y="328" font-size="11.5" fill="#334155">then the user's External Call CID,</text><text x="34" y="344" font-size="11.5" fill="#334155">then the trunk's Default Outbound Caller ID (or From User).</text><text x="34" y="360" font-size="11.5" fill="#334155">A call that came in from another trunk keeps its caller.</text><rect x="410" y="270" width="350" height="95" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="426" cy="288" r="11" fill="#7c3aed"/><text x="426" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="442" y="292" font-size="13" font-weight="700" fill="#0f172a">Trunk caller ID format</text><text x="420" y="312" font-size="11.5" fill="#334155">Trunks: Outbound Caller ID Normalization</text><text x="420" y="328" font-size="11.5" fill="#334155">Keep only the last N digits, then Prepend</text><text x="420" y="344" font-size="11.5" fill="#334155">Restored and applied again for each trunk tried</text><rect x="800" y="270" width="350" height="95" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="810" y="292" font-size="13" font-weight="700" fill="#0f172a">Carrier</text><text x="810" y="312" font-size="11.5" fill="#334155">From, and P-Asserted-Identity if the trunk sends it</text><text x="810" y="328" font-size="11.5" fill="#334155">From User on the trunk replaces the user part of From</text><line x1="374" y1="318" x2="404" y2="318" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="760" y1="318" x2="794" y2="318" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="32" y="390" font-size="12" font-family="monospace" font-weight="700" fill="#6d28d9">4312340000</text><text x="418" y="390" font-size="12" font-family="monospace" font-weight="700" fill="#6d28d9">keep 4, prepend +431234</text><text x="808" y="390" font-size="12" font-family="monospace" font-weight="700" fill="#6d28d9">+4312340000</text><text x="24" y="414" font-size="11" fill="#64748b">Example, tested with a real call: with a route override set, the override went out instead of the trunk number; with none, the trunk number.</text><rect x="10" y="440" width="1160" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="24" y="464" font-size="15" font-weight="800" fill="#b45309">Incoming call</text><text x="160" y="464" font-size="12" font-weight="700" fill="#92400e">The caller's number</text><rect x="20" y="480" width="110" height="75" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="30" y="502" font-size="13" font-weight="700" fill="#0f172a">Carrier</text><text x="30" y="522" font-size="11.5" fill="#334155">sends it</text><rect x="150" y="480" width="310" height="75" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><circle cx="166" cy="498" r="11" fill="#d97706"/><text x="166" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="182" y="502" font-size="13" font-weight="700" fill="#0f172a">Caller rules</text><text x="160" y="522" font-size="11.5" fill="#334155">Inbound Call Normalization, number: caller</text><text x="160" y="538" font-size="11.5" fill="#334155">A trunk's own rule before a rule for all trunks</text><rect x="500" y="480" width="260" height="75" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><circle cx="516" cy="498" r="11" fill="#d97706"/><text x="516" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="532" y="502" font-size="13" font-weight="700" fill="#0f172a">Blacklist</text><text x="510" y="522" font-size="11.5" fill="#334155">Sees the number after step 1</text><rect x="800" y="480" width="350" height="75" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="810" y="502" font-size="13" font-weight="700" fill="#0f172a">Screen, call history, callback</text><text x="810" y="522" font-size="11.5" fill="#334155">The number after step 1</text><line x1="130" y1="518" x2="144" y2="518" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="460" y1="518" x2="494" y2="518" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="760" y1="518" x2="794" y2="518" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="150" y="572" font-size="12" font-family="monospace" font-weight="700" fill="#b45309">+4366412345678 becomes 066412345678</text><text x="24" y="592" font-size="12" font-weight="700" fill="#92400e">The dialled number (DID)</text><rect x="20" y="600" width="110" height="75" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="30" y="622" font-size="13" font-weight="700" fill="#0f172a">Carrier</text><text x="30" y="642" font-size="11.5" fill="#334155">sends it</text><rect x="150" y="600" width="240" height="75" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><circle cx="166" cy="618" r="11" fill="#d97706"/><text x="166" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="182" y="622" font-size="13" font-weight="700" fill="#0f172a">Trunk DID trim</text><text x="160" y="642" font-size="11.5" fill="#334155">Trunks: Inbound DID Trim</text><text x="160" y="658" font-size="11.5" fill="#334155">Keeps the last N digits</text><rect x="430" y="600" width="280" height="75" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><circle cx="446" cy="618" r="11" fill="#d97706"/><text x="446" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="462" y="622" font-size="13" font-weight="700" fill="#0f172a">DID rules</text><text x="440" y="642" font-size="11.5" fill="#334155">Inbound Call Normalization, number: DID</text><text x="440" y="658" font-size="11.5" fill="#334155">Same precedence as caller rules</text><rect x="750" y="600" width="400" height="75" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><circle cx="766" cy="618" r="11" fill="#d97706"/><text x="766" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="782" y="622" font-size="13" font-weight="700" fill="#0f172a">Inbound route</text><text x="760" y="642" font-size="11.5" fill="#334155">The result must match the DID on the Inbound page</text><text x="760" y="658" font-size="11.5" fill="#334155">Otherwise: transit if the trunk allows it, or not found</text><line x1="130" y1="638" x2="144" y2="638" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="390" y1="638" x2="424" y2="638" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><line x1="710" y1="638" x2="744" y2="638" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="150" y="692" font-size="12" font-family="monospace" font-weight="700" fill="#b45309">+431999  stays  +431999  becomes  01999</text></svg>