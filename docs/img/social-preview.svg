<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.75" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow1)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <!-- Left Content -->
  <!-- Brand mark -->
  <g transform="translate(88, 140)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#accent)"/>
    <path d="M24 25c0-1.7 1.3-3 3-3h4.2c1.4 0 2.6.9 2.9 2.3l1.1 4.8c.3 1.2-.2 2.4-1.2 3.1l-2.6 1.8a22 22 0 0 0 8.6 8.6l1.8-2.6c.7-1 1.9-1.5 3.1-1.2l4.8 1.1c1.4.3 2.3 1.5 2.3 2.9V47c0 1.7-1.3 3-3 3h-1C33.7 50 24 40.3 24 27v-2z" fill="#0f172a"/>
    <circle cx="50" cy="22" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- Repo Badge -->
  <g transform="translate(180, 114)">
    <rect x="0" y="0" width="184" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="18" cy="15" r="4.5" fill="#22c55e"/>
    <text x="32" y="20" fill="#cbd5e1" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.04em">OPEN SOURCE · MIT</text>
  </g>

  <!-- Title -->
  <text x="180" y="210" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.02em">AiPBX</text>

  <!-- One-line description -->
  <text x="88" y="284" fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="600">Self-Hosted AI-Powered PBX &amp; Call Center</text>
  <text x="88" y="324" fill="#94a3b8" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">Native Asterisk 22, AI Voice Agents, WebRTC &amp; Unified Comms.</text>

  <!-- Feature Pills -->
  <g transform="translate(88, 368)" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">
    <rect x="0" y="0" width="154" height="38" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="77" y="24" text-anchor="middle" fill="#7dd3fc">Asterisk 22 · PJSIP</text>

    <rect x="168" y="0" width="152" height="38" rx="10" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.45"/>
    <text x="244" y="24" text-anchor="middle" fill="#a5b4fc">AI Voice Agents</text>

    <rect x="334" y="0" width="124" height="38" rx="10" fill="#1e293b" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="396" y="24" text-anchor="middle" fill="#6ee7b7">Call Center</text>

    <rect x="472" y="0" width="152" height="38" rx="10" fill="#1e293b" stroke="#f472b6" stroke-opacity="0.45"/>
    <text x="548" y="24" text-anchor="middle" fill="#f9a8d4">WebRTC &amp; Apps</text>
  </g>

  <!-- Footer URL -->
  <text x="88" y="548" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="500">github.com/mahirgul/AiPBX</text>

  <!-- Right Side Architecture Card -->
  <g transform="translate(790, 118)">
    <rect x="0" y="0" width="404" height="404" rx="22" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>

    <!-- Header dots -->
    <circle cx="28" cy="28" r="5.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="28" r="5.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="68" cy="28" r="5.5" fill="#22c55e" opacity="0.8"/>
    <text x="376" y="33" text-anchor="end" fill="#64748b" font-family="ui-monospace, monospace" font-size="12">ARI · AudioSocket · 8kHz</text>
    <line x1="20" y1="50" x2="384" y2="50" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Node 1: Asterisk -->
    <rect x="28" y="72" width="348" height="72" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <circle cx="62" cy="108" r="18" fill="#0284c7" fill-opacity="0.25"/>
    <text x="62" y="114" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="15" font-weight="700">SIP</text>
    <text x="94" y="102" fill="#f8fafc" font-family="Inter, sans-serif" font-size="17" font-weight="700">Asterisk 22 Core</text>
    <text x="94" y="124" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">PJSIP · Queues · IVR · Recordings</text>

    <!-- Connector -->
    <line x1="202" y1="144" x2="202" y2="174" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Node 2: AI Runtime -->
    <rect x="28" y="174" width="348" height="80" rx="14" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.6"/>
    <circle cx="62" cy="214" r="18" fill="#6366f1" fill-opacity="0.25"/>
    <text x="62" y="220" text-anchor="middle" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="15" font-weight="700">AI</text>
    <text x="94" y="206" fill="#f8fafc" font-family="Inter, sans-serif" font-size="17" font-weight="700">AI Voice &amp; Tool Runtime</text>
    <text x="94" y="228" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Cascade / Realtime · RAG · DB Tools</text>

    <!-- Connector -->
    <line x1="202" y1="254" x2="202" y2="284" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Node 3: Web & Integrations -->
    <rect x="28" y="284" width="348" height="72" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity="0.5"/>
    <circle cx="62" cy="320" r="18" fill="#10b981" fill-opacity="0.25"/>
    <text x="62" y="326" text-anchor="middle" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="14" font-weight="700">API</text>
    <text x="94" y="314" fill="#f8fafc" font-family="Inter, sans-serif" font-size="17" font-weight="700">Portal, CRM &amp; SSO</text>
    <text x="94" y="336" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Odoo · ERPNext · SSO · REST</text>

    <!-- Bottom status -->
    <text x="202" y="384" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="12" font-weight="600">LOCAL TTS  ·  CLOUD AI  ·  PLUGINS</text>
  </g>
</svg>
