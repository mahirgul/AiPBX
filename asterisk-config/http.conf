[general]
enabled=yes
; Plain HTTP/WS on loopback only: browser/mobile WebRTC comes in through
; 443 → Apache → /ws → 127.0.0.1:8088, so it does not need to be public.
bindaddr=127.0.0.1
bindport=8088
; Direct WSS (pjsip_wss_port, default 8089) with the real certificate
; (install.sh and the certbot deploy hook copy fullchain/privkey here).
; It used the self-signed asterisk.pem before, which browsers rejected.
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/fullchain.pem
tlsprivatekey=/etc/asterisk/keys/privkey.pem
; /httpstatus exposed the version and bind addresses to everyone.
enable_status=no
servername=AiPBX
