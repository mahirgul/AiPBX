[general]
enabled=yes
; Düz HTTP/WS yalnızca yerel: tarayıcı/mobil WebRTC 443 → Apache → /ws →
; 127.0.0.1:8088 yolundan gelir; dışarıya açık olmasına gerek yok.
bindaddr=127.0.0.1
bindport=8088
; Doğrudan WSS (pjsip_wss_port, varsayılan 8089) — gerçek sertifikayla
; (install.sh ve certbot deploy hook'u fullchain/privkey'i buraya kopyalar).
; Önceden kendinden imzalı asterisk.pem kullanılıyordu, tarayıcılar reddediyordu.
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/fullchain.pem
tlsprivatekey=/etc/asterisk/keys/privkey.pem
; /httpstatus sürüm ve bağlantı adreslerini herkese gösteriyordu.
enable_status=no
servername=AiPBX
