;
; res_hep Module configuration for Asterisk
;

;
; Note that this configuration file is consumed by res_hep, which is responsible
; for the HEPv3 protocol manipulation and managing the connection to the Homer
; capture server. Additional modules provide specific messages to be sent to
; the Homer server:
;  - res_hep_pjsip: Send SIP messages transmitted/received by the PJSIP stack
;  - res_hep_rtcp: Send RTCP information (all channels)
;

; All settings are currently set in the general section.
;
; THIS INSTALL: capture is OFF by default (opt-in). Turning it on sends
; HEPv3 over UDP to the aipbx-signaling daemon that ships with the portal,
; on loopback only (127.0.0.1:9061 — Asterisk and the daemon on the same
; server). The daemon writes batched rows to pbx_signaling_events, which
; the dialplan editor's Echo box reads. Capture costs one UDP send per
; message plus the daemon's batched database writes; an installation that
; does not use that box keeps `enabled = no` and pays nothing. Asterisk
; never waits for the daemon: res_hep sends and moves on; a daemon that is
; down only loses captures, no call waits on it.
[general]
enabled = no                        ; Capture is OPT-IN: set to yes to start
                                    ; sending HEPv3 to the local daemon.
capture_address = 127.0.0.1:9061    ; The aipbx-signaling daemon, loopback only.
capture_password = aipbx            ; The daemon's app checks this when set;
                                    ; keep in step with the daemon.
capture_id = 1001                  ; A unique integer identifier for this
                                   ; server. This ID will be embedded sent
                                   ; with each packet from this server.
;capture_name = asterisk           ; A unique string identifier for this
                                   ; server. This ID will be embedded sent
                                   ; with each packet from this server.
uuid_type = call-id                ; Specify the preferred source for the Homer
                                   ; correlation UUID. Valid options are:
                                   ; - 'call-id' for the PJSIP or chan_sip SIP
                                   ;             Call-ID
                                   ; - 'channel' for the Asterisk channel name
                                   ; Note: If 'call-id' is specified but the
                                   ; channel is not PJSIP or chan_sip then the
                                   ; Asterisk channel name will be used instead.

#tryinclude "pbx/hep_*.conf"
