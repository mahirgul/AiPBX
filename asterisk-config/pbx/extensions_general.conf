include => internal-numbers-pbx

; Varsayilan (Grup 1) — dahili + giden rotalar
[from-internal-pbx]
include => from-internal-pbx-ortak
include => from-internal-outbound-1
include => featurecodes-pbx

; AMI Originate Context for Web Dialer & Header Softphone
[cc-internal]
include => from-internal-pbx

; Native Incoming FAX Context
[from-trunk-fax]
exten => _X!,1,NoOp(Incoming FAX processing for ${EXTEN} from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,StopPlaytones()
 same => n,Set(FAXOPT(ecm)=no)
 same => n,Set(FAXOPT(modem)=v29,v27)
 same => n,Set(FAXOPT(maxrate)=9600)
 same => n,Set(FAXOPT(minrate)=2400)
 same => n,Set(FAX_ID=${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)}_${CALLERID(num)}_${UNIQUEID})
 same => n,Set(FAX_FILE=/var/spool/asterisk/fax/${FAX_ID}.tif)
 same => n,ReceiveFAX(${FAX_FILE},df)
 same => n,Hangup()

exten => h,1,NoOp(FAX Receive Completed: Status=${FAXOPT(status)}, Pages=${FAXOPT(pages)})
 same => n,Set(FAX_CNUM=${FILTER(0-9+,${CALLERID(num)})})
 same => n,Set(FAX_DID=${FILTER(0-9+,${IF($["${CDR(did)}" != ""]?${CDR(did)}:${EXTEN})})})
 same => n,ExecIf($["${FAX_FILE}" != ""]?System(/usr/local/bin/process_incoming_fax.sh "${FAX_FILE}" "${FAX_DID}" "${FAX_CNUM}" "${FAXOPT(pages)}" "${FAXOPT(status)}"))

; Native Outgoing FAX Context (SendFAX via Call Files)
[outbound-fax]
exten => s,1,NoOp(Sending Outbound FAX to ${FAX_DEST} from ${FAX_SENDER})
 same => n,Set(FAXOPT(headerinfo)=Karabuk Universitesi${IF($["${FAX_SENDER_NAME}" != ""]?" - "${FAX_SENDER_NAME}:)})
 same => n,Set(FAXOPT(localstationid)=0370418${FAX_SENDER})
 same => n,SendFAX(${FAX_TIF_PATH},d,f)
 same => n,Hangup()

exten => h,1,NoOp(Outbound FAX Completed. Status=${FAXOPT(status)})
 same => n,System(/usr/local/bin/process_outgoing_fax_result.sh "${FAX_ID}" "${FAXOPT(status)}" "${FAXOPT(error)}" "${FAXOPT(pages)}")

; Enterprise Adaptive Jitter Buffer (AJB) Subroutine for Callee Channels
[sub-callee-jb]
exten => s,1,NoOp(Applying Adaptive Jitter Buffer to Callee Channel ${CHANNEL})
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Return()

