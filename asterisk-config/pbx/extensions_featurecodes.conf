; Feature Code (Star Code) Dialplan (Auto-generated by AI PBX)

[featurecodes-pbx]

; Rahatsiz Etme (DND) Ac/Kapa (dnd_toggle)
exten => *78,1,NoOp(Feature Code dnd_toggle by ${CALLERID(num)})
 same => n,System(/usr/local/bin/feature_code_action.php dnd_toggle ${CALLERID(num)} &)
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Hangup()

; Cagri Yonlendirme Ayarla (cf_set)
exten => *72,1,NoOp(Feature Code cf_set by ${CALLERID(num)})
 same => n,Answer()
 same => n,Read(CFTARGET,,10,,3,10)
 same => n,GotoIf($["${CFTARGET}" = ""]?cfset_empty)
 same => n,System(/usr/local/bin/feature_code_action.php cf_set ${CALLERID(num)} ${CFTARGET} &)
 same => n,Playback(beep)
 same => n,Hangup()
 same => n(cfset_empty),Playback(beep)
 same => n,Hangup()

