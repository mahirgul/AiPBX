; Feature Code (Star Code) Dialplan (Auto-generated by AI PBX)

[featurecodes-pbx]

; Rahatsiz Etme (DND) Ac/Kapa (dnd_toggle)
exten => *78,1,NoOp(Feature Code dnd_toggle by ${CALLERID(num)})
 same => n,System(/usr/local/bin/feature_code_action.php dnd_toggle ${CALLERID(num)} &)
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Hangup()

; Cagri Yonlendirme Ayarla (cf_set)
exten => *72,1,NoOp(Feature Code cf_set by ${CALLERID(num)})
 same => n,Answer()
 same => n,Read(CFTARGET,,10,,3,10)
 same => n,GotoIf($["${CFTARGET}" = ""]?cfset_empty)
 same => n,System(/usr/local/bin/feature_code_action.php cf_set ${CALLERID(num)} ${CFTARGET} &)
 same => n,Playback(beep)
 same => n,Hangup()
 same => n(cfset_empty),Playback(beep)
 same => n,Hangup()

; Cagri Yonlendirme Iptal (cf_cancel)
exten => *73,1,NoOp(Feature Code cf_cancel by ${CALLERID(num)})
 same => n,System(/usr/local/bin/feature_code_action.php cf_cancel ${CALLERID(num)} &)
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Hangup()

; Gruptan Cagri Cekme (pickup_group)
exten => *20,1,NoOp(Feature Code pickup_group by ${CALLERID(num)})
 same => n,Pickup()
 same => n,Hangup()

; Belirli Dahiliden Cagri Cekme (pickup_directed)
exten => *21,1,NoOp(Feature Code pickup_directed by ${CALLERID(num)})
 same => n,Answer()
 same => n,Read(PICKTARGET,,10,,3,10)
 same => n,GotoIf($["${PICKTARGET}" = ""]?pickdir_empty)
 same => n,PickupChan(PJSIP/${PICKTARGET}-sip&PJSIP/${PICKTARGET}-webrtc&PJSIP/${PICKTARGET}-mob-webrtc)
 same => n,Hangup()
 same => n(pickdir_empty),Playback(beep)
 same => n,Hangup()

; Cagri Dinleme (Spy) (spy)
exten => *90,1,NoOp(Feature Code spy by ${CALLERID(num)})
 same => n,GotoIf($["${USER_ROLE}" = "admin" | "${USER_ROLE}" = "cc_manager"]?allowed_spy)
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Hangup()
 same => n(allowed_spy),NoOp(Yetki dogrulandi: ${USER_ROLE})
 same => n,Answer()
 same => n,Read(SPYTARGET,,10,,3,10)
 same => n,GotoIf($["${SPYTARGET}" = ""]?spy_empty)
 same => n,ChanSpy(PJSIP/${SPYTARGET},b)
 same => n,Hangup()
 same => n(spy_empty),Playback(beep)
 same => n,Hangup()

