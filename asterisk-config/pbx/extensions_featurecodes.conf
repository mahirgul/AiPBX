; Feature Code (Star Code) Dialplan (Auto-generated by AI PBX)

[featurecodes-pbx]

; Do Not Disturb (DND) Toggle (dnd_toggle)
; Do Not Disturb (DND) Toggle (dnd_toggle)
exten => *78,1,NoOp(Feature Code dnd_toggle by ${CALLERID(num)})
 same => n,System(/usr/local/bin/feature_code_action.php dnd_toggle ${FILTER(0-9,${CALLERID(num)})} &)
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Hangup()

; Set Call Forwarding (cf_set)
; Set Call Forwarding (cf_set)
exten => *72,1,NoOp(Feature Code cf_set by ${CALLERID(num)})
 same => n,Answer()
 same => n,Read(CFTARGET,,10,,3,10)
 same => n,Set(CFTARGET=${FILTER(0-9,${CFTARGET})})
 same => n,GotoIf($["${CFTARGET}" = ""]?cfset_empty)
 same => n,System(/usr/local/bin/feature_code_action.php cf_set ${FILTER(0-9,${CALLERID(num)})} ${CFTARGET} &)
 same => n,Playback(beep)
 same => n,Hangup()
 same => n(cfset_empty),Playback(beep)
 same => n,Hangup()

