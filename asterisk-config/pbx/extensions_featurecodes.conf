; Belirli Dahiliden Cagri Cekme (pickup_directed)
exten => *21,1,NoOp(Feature Code pickup_directed by ${CALLERID(num)})
 same => n,Answer()
 same => n,Read(PICKTARGET,,10,,3,10)
 same => n,GotoIf($["${PICKTARGET}" = ""]?pickdir_empty)
 same => n,PickupChan(PJSIP/${PICKTARGET}-sip&PJSIP/${PICKTARGET}-webrtc&PJSIP/${PICKTARGET}-mob-webrtc)
 same => n,Hangup()
 same => n(pickdir_empty),Playback(beep)
 same => n,Hangup()

; Cagri Dinleme (Spy) (spy)
exten => *90,1,NoOp(Feature Code spy by ${CALLERID(num)})
 same => n,GotoIf($["${USER_ROLE}" = "admin" | "${USER_ROLE}" = "cc_manager"]?allowed_spy)
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Hangup()
 same => n(allowed_spy),NoOp(Yetki dogrulandi: ${USER_ROLE})
 same => n,Answer()
 same => n,Read(SPYTARGET,,10,,3,10)
 same => n,GotoIf($["${SPYTARGET}" = ""]?spy_empty)
 same => n,ChanSpy(PJSIP/${SPYTARGET},b)
 same => n,Hangup()
 same => n(spy_empty),Playback(beep)
 same => n,Hangup()

