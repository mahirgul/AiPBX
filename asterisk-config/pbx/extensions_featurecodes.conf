; Call Spy (spy)
; Call Spy (spy)
exten => *90,1,NoOp(Feature Code spy by ${CALLERID(num)})
 same => n,GotoIf($["${USER_ROLE}" = "admin" | "${USER_ROLE}" = "cc_manager"]?allowed_spy)
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Hangup()
 same => n(allowed_spy),NoOp(Permission verified: ${USER_ROLE})
 same => n,Answer()
 same => n,Read(SPYTARGET,,10,,3,10)
 same => n,Set(SPYTARGET=${FILTER(0-9,${SPYTARGET})})
 same => n,GotoIf($["${SPYTARGET}" = ""]?spy_empty)
 same => n,ChanSpy(PJSIP/${SPYTARGET}-,q)
 same => n,Hangup()
 same => n(spy_empty),Playback(beep)
 same => n,Hangup()

