; ==========================================================
; Master PJSIP Transports Configuration (Auto-generated by AI PBX via pjsipsettings DB)
; ==========================================================

[global]
user_agent=AI-PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.100.0/255.255.255.0
local_net=10.8.0.0/255.255.255.0

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
local_net=192.168.100.0/255.255.255.0
local_net=10.8.0.0/255.255.255.0

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/fullchain.pem
priv_key_file=/etc/asterisk/keys/privkey.pem
method=tlsv1_2
local_net=192.168.100.0/255.255.255.0
local_net=10.8.0.0/255.255.255.0

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
cert_file=/etc/asterisk/keys/fullchain.pem
priv_key_file=/etc/asterisk/keys/privkey.pem
local_net=192.168.100.0/255.255.255.0
local_net=10.8.0.0/255.255.255.0

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088
local_net=192.168.100.0/255.255.255.0
local_net=10.8.0.0/255.255.255.0

