; ==========================================================
; Master PJSIP Endpoints Configuration (Auto-generated by AI PBX via sip Key-Value DB)
; ==========================================================

[endpoint-sip](!)
type=endpoint
context=from-internal-pbx
disallow=all
allow=alaw,ulaw,g722
transport=transport-udp
identify_by=auth_username,username
rtp_symmetric=yes
rewrite_contact=yes
force_rport=yes
direct_media=no
dtmf_mode=rfc4733
rtp_timeout=60
rtp_timeout_hold=300

[endpoint-wss](!)
type=endpoint
context=from-internal-pbx
disallow=all
allow=opus,alaw,ulaw,g722
transport=transport-ws
identify_by=auth_username,username
dtmf_mode=rfc4733
rtp_timeout=30
rtp_timeout_hold=300
webrtc=yes
rtcp_mux=yes
direct_media=no
media_use_received_transport=yes
ice_support=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
dtls_cert_file=/etc/asterisk/keys/asterisk.pem
dtls_ca_file=/etc/asterisk/keys/asterisk.pem
rtp_symmetric=yes
rewrite_contact=yes
force_rport=yes

[auth-userpass](!)
type=auth
auth_type=userpass

[aor-dual](!)
type=aor
max_contacts=10
remove_existing=no
default_expiration=1800
maximum_expiration=3600
minimum_expiration=60
qualify_frequency=60

[aor-mobile](!)
type=aor
max_contacts=1
remove_existing=yes
default_expiration=1800
maximum_expiration=3600
minimum_expiration=60
qualify_frequency=0

