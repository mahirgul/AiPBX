; Native Inbound DID Dialplan (Auto-generated by AI PBX)
[from-trunk-inbound]

; Default Fallback DID
exten => _X.,1,NoOp(Fallback Inbound Call for DID ${EXTEN})
 same => n,Set(CDR(did)=${EXTEN})
 same => n,Set(CDR(direction)=inbound)
 same => n,Hangup(1)

; --- Inbound route wrapper that detects the hang-up (busy) tone ---
; ("kapanma tonu" = hang-up tone; the name stays: trunks store it as their context)
[from-trunk-kapanma-tonu]
exten => _X.,1,NoOp(Hangup tone detector active - DID ${EXTEN})
 same => n,Set(TONE_DETECT(0,,brg(kapanma-tonu,s,1))=)
 same => n,Goto(from-trunk-inbound,${EXTEN},1)

[kapanma-tonu]
exten => s,1,NoOp(Hangup tone detected - ending the call)
 same => n,Hangup()

