; DID: 19000 (19000)
exten => 19000,1,NoOp(Inbound call for DID 19000 - 19000)
 same => n,Set(CDR(did)=19000)
 same => n,Set(CDR(direction)=inbound)
 same => n,Set(CHANNEL(accountcode)=19000)
 same => n,Set(C_SIP=${PJSIP_DIAL_CONTACTS(19000-sip)})
 same => n,Set(C_WEB=${PJSIP_DIAL_CONTACTS(19000-webrtc)})
 same => n,Set(C_MOB=${PJSIP_DIAL_CONTACTS(19000-mob-webrtc)})
 same => n,Set(DIAL_CONTACTS=${C_SIP}${IF($["${C_SIP}" != "" & "${C_WEB}" != ""]?&)}${C_WEB})
 same => n,Set(DIAL_CONTACTS=${DIAL_CONTACTS}${IF($["${DIAL_CONTACTS}" != "" & "${C_MOB}" != ""]?&)}${C_MOB})
 same => n,GotoIf($["${DIAL_CONTACTS}" = ""]?lbl_unavail_dest_1_19000_1)
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Dial(${DIAL_CONTACTS},30,tTb(sub-callee-jb^s^1))
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?lbl_busy_dest_1_19000_1)
 same => n,GotoIf($["${DIALSTATUS}" = "CONGESTION"]?lbl_busy_dest_1_19000_1)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?lbl_noans_dest_1_19000_1)
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?lbl_unavail_dest_1_19000_1)
 same => n,Hangup()
 same => n(lbl_busy_dest_1_19000_1),NoOp(Dahili 19000 Mesgul - DIALSTATUS=${DIALSTATUS})
 same => n,Hangup(17)
 same => n(lbl_noans_dest_1_19000_1),NoOp(Dahili 19000 Cevapsiz - DIALSTATUS=${DIALSTATUS})
 same => n,Hangup()
 same => n(lbl_unavail_dest_1_19000_1),NoOp(Dahili 19000 Kayitli Cihaz Yok veya Ulasilamiyor)
 same => n,Hangup()

