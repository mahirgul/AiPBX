;
; Asterisk CLI permissions configuration for AiPBX
;
; Manages which users and groups may execute commands over the Asterisk
; control socket (/var/run/asterisk/asterisk.ctl, 0660 asterisk:asterisk).
;
; Security boundary (P1.4):
; - root and asterisk (system service) have full command access.
; - www-data (web portal runtime) is strictly constrained to safe operational
;   and status commands. Destructive or arbitrary execution commands
;   (e.g., 'core stop', 'core restart', 'module load', '! <shell>', 'file ...')
;   are strictly DENIED.
; - Asterisk treats every permit as a regular expression searched ANYWHERE in the
;   command, so each [www-data] permit is anchored with ^...$. Without the anchors
;   'module load x pjsip show.x' passed the check (verified live, 2026-11-11).
;

[general]
default_perm = deny

[root]
permit = all

[asterisk]
permit = all

[www-data]
deny = all
permit = ^core show version$
permit = ^core show uptime.*$
permit = ^core show channels.*$
permit = ^pjsip show.*$
permit = ^queue show.*$
permit = ^queue add member.*$
permit = ^queue remove member.*$
permit = ^queue pause member.*$
permit = ^queue unpause member.*$
permit = ^database show.*$
permit = ^database get.*$
permit = ^database put.*$
permit = ^database del.*$
permit = ^confbridge list.*$
permit = ^confbridge kick.*$
permit = ^confbridge mute.*$
permit = ^confbridge unmute.*$
permit = ^dialplan reload.*$
permit = ^pjsip reload.*$
permit = ^queue reload.*$
permit = ^core reload.*$
permit = ^moh reload.*$
permit = ^voicemail reload.*$
permit = ^module reload.*$
permit = ^devstate change.*$
permit = ^pjsip set logger.*$
permit = ^database deltree.*$
permit = ^config show help.*$
permit = ^dialplan show.*$
permit = ^core restart when convenient$
permit = ^fax show.*$
permit = ^pjsip send notify.*$
permit = ^channel originate Local/[A-Za-z0-9_#-]+@cc-internal extension .*$
permit = ^channel request hangup.*$
permit = ^channel get.*$
permit = ^logger rotate.*$
