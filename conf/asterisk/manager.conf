[general]
enabled = yes
bindaddr = 127.0.0.1
port = 5038

; Dynamic credentials are automatically generated and configured
; during installation by install.sh in /etc/asterisk/manager.conf
[aipbx-manager]
secret = ${AMI_PASS}
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.0
read = originate,call,agent
write = originate,call,agent
writetimeout = 5000
