# The portal's vhost (docker/README.md).
#
# Phase 1 of the container split serves HTTP only: the 443 edge (nginx ALPN
# multiplexer: HTTPS + WSS + TURNS on one port) and coturn are host-level
# services that the portal orchestrates, and they stay out of this image on
# purpose. Put a reverse proxy in front if you need TLS, or run the all-in-one
# container where install.sh sets the edge up. docs/ for the roadmap.
#
# The port is written at start-up from AIPBX_HTTP_PORT (docker/web/entrypoint.sh
# renders the placeholder below), so host networking does not pin you to 80.

<VirtualHost *:__AIPBX_HTTP_PORT__>
    ServerName __AIPBX_DOMAIN__
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/aipbx_error.log
    CustomLog ${APACHE_LOG_DIR}/aipbx_access.log combined
</VirtualHost>

# The rules install.sh writes into conf-available/aipbx-routing.conf, kept
# byte-for-byte in behaviour: API, assets and plugin paths are served as they
# are, everything else goes to the front controller, and the directories that
# hold code, dependencies or migrations are never served.
<Directory "/var/www/html">
    DirectoryIndex index.php
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api/(v1|plugins)(/|$)
    RewriteRule ^(api|assets|modules)(/|$) - [L]
    RewriteRule ^chat/(ws|api|media)(/|$) - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [QSA,L]
</Directory>

<FilesMatch "\.aab$">
    Require all denied
</FilesMatch>

<Directory "/var/www/html/src">
    Require all denied
</Directory>
<Directory "/var/www/html/vendor">
    Require all denied
</Directory>
<Directory "/var/www/html/db">
    Require all denied
</Directory>
<Directory "/var/www/html/bin">
    Require all denied
</Directory>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Content-Security-Policy "frame-ancestors 'self'"
    Header setifempty Referrer-Policy "strict-origin-when-cross-origin"
    <LocationMatch "^/assets/images/brand/">
        Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; sandbox"
    </LocationMatch>
</IfModule>
